name: Windows Package

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and smoke-test Windows EXE
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-build.lock
            requirements-ci.lock

      - name: Build, test and diagnose package
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload Windows package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ScreenshotTimeLapse-windows-${{ github.sha }}
          path: |
            dist/ScreenshotTimeLapse.exe
            dist/ScreenshotTimeLapse.exe.sha256
          if-no-files-found: error
          retention-days: 14
