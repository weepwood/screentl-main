name: Release Windows Application

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build single-file application
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ScreenshotTimeLapse
          --copy-metadata imageio --copy-metadata moviepy --copy-metadata imageio-ffmpeg
          app.py

      - name: Verify package
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ScreenshotTimeLapse.exe")) { throw "EXE build failed" }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/ScreenshotTimeLapse.exe" `
            --title "ScreenshotTimeLapse ${{ github.ref_name }}" `
            --generate-notes
