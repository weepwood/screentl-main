name: Release Windows Application

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish release
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-build.lock
            requirements-ci.lock

      - name: Verify release tag
        run: python scripts/check_release_version.py

      - name: Build, test and diagnose package
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/ScreenshotTimeLapse.exe" `
            "dist/ScreenshotTimeLapse.exe.sha256" `
            --verify-tag `
            --title "ScreenshotTimeLapse ${{ github.ref_name }}" `
            --generate-notes
