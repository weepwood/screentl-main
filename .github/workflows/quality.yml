name: Quality Review

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Static checks and tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked CI dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --disable-pip-version-check -r requirements-ci.lock

      - name: Compile Python source
        run: >-
          python -m compileall -q
          app.py journal.py makevideo.py screenshot.py screentl scripts tests

      - name: Run Ruff review
        run: >-
          python -m ruff check
          app.py journal.py makevideo.py screenshot.py screentl scripts tests

      - name: Run tests with coverage
        shell: pwsh
        run: |
          $output = python -m pytest --cov=screentl --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath pytest.log
          exit $exitCode

      - name: Audit locked runtime dependencies
        run: python -m pip_audit -r requirements.lock

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.sha }}
          path: |
            pytest.log
            test-results.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14
