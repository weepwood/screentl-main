name: Quality Review

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Static checks and tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked CI dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2
          python -m pip install --disable-pip-version-check -r requirements-ci.lock

      - name: Compile Python source
        run: python -m compileall -q app.py makevideo.py screenshot.py screentl scripts tests

      - name: Run Ruff review
        run: python -m ruff check app.py makevideo.py screenshot.py screentl scripts tests

      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov=screentl
          --cov-report=term-missing
          --cov-report=xml

      - name: Audit locked runtime dependencies
        run: python -m pip_audit -r requirements.lock

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
