name: Quality Review

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Static checks and tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile Python source
        run: python -m compileall -q app.py makevideo.py screenshot.py screentl tests

      - name: Run Ruff review
        run: ruff check app.py makevideo.py screenshot.py screentl tests

      - name: Run tests
        run: python -m pytest -q

      - name: Audit dependencies
        run: pip-audit -r requirements.txt
