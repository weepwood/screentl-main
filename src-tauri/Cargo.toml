[package]
name = "screenshot-timelapse"
version = "0.3.0"
description = "Local-first screenshot time-lapse work journal"
authors = ["weepwood"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "screenshot_timelapse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = [] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
