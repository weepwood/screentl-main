[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot-timelapse"
version = "0.2.0"
description = "Local-first screenshot time-lapse recorder for Windows"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{ name = "weepwood" }]
dependencies = [
  "moviepy>=1.0.3,<2",
  "proglog>=0.1.10,<2",
  "PyAutoGUI>=0.9.54,<1",
  "pystray>=0.19.5,<1",
]

[project.scripts]
screentl-capture = "screenshot:main"
screentl-render = "makevideo:main"

[tool.setuptools]
packages = ["screentl"]
py-modules = ["screenshot", "makevideo"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["screentl"]
omit = [
  "screentl/ui.py",
  "screentl/application.py",
  "screentl/windows.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 65
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001", "DTZ011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
